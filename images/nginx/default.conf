upstream admin {
    server admin:8000;
}

upstream announcements {
    server announcements_api:8080;
}

upstream users {
    server users_api:5000;
}

upstream statistics {
    server statistics_api:8081;
}

server {
    listen 80;

    location ~ ^/(uz|en|ru)/admin {
        proxy_pass http://admin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    location /api/v1/announcements/ {
        proxy_pass http://announcements;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    location ~ ^/api/v1/(users|transaction) {
        proxy_pass http://users;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    location /api/v1/statistics {
        proxy_pass http://statistics;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    # Serve static and media files if needed
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    location /static/ {
        alias /usr/share/nginx/staticfiles/;
    }
}
