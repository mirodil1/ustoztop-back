upstream admin {
    server admin:8000;
}

upstream announcements {
    server announcements_api:8080;
}

upstream users {
    server users_api:5000;
}

upstream statistics {
    server statistics_api:8081;
}

server {
    listen 80;

    location /admin(/.*)?$ {
        proxy_pass http://admin$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    location ~* /announcements(/.*)?$ {
        proxy_pass http://announcements$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    location ~* /users(/.*)?$ {
        proxy_pass http://users$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    location ~* /statistics(/.*)?$ {
        proxy_pass http://statistics$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 100M;
        proxy_redirect off;
    }

    # Serve static and media files if needed
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    location /static/ {
        alias /usr/share/nginx/staticfiles/;
    }
}
